<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>data.vlaj.at</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
<nav class="navbar">
  <div class="nav-logo">
    <span class="nav-logo-dot"></span>
    data.vlaj.at
  </div>
  <div class="nav-search-wrap" id="searchWrap" onclick="document.getElementById('navSearch').focus()">
    <i class="ti ti-search" style="font-size:15px;color:var(--text3);flex-shrink:0;" aria-hidden="true"></i>
    <input id="navSearch" type="text" placeholder="Indikator suchen…" autocomplete="off"
      oninput="onNavSearch(this.value)" onfocus="openNavDD()" />
    <i id="navSearchClear" class="ti ti-x" style="font-size:13px;color:var(--text3);cursor:pointer;display:none;flex-shrink:0;" onclick="clearNavSearch()" aria-label="Suche löschen"></i>
  </div>
  <div class="nav-right">
    <span class="status-dot"></span>
    <span id="dataAge" style="font-size:11px;color:var(--text3)">Verbinde…</span>
    <button id="themeToggle" onclick="toggleTheme()">
      <span id="themeIcon">🌙</span>
      <span id="themeLabel">Dark</span>
    </button>
  </div>
  <!-- Search dropdown -->
  <div class="nav-dd" id="navDD"><div id="navDDContent"></div></div>
</nav>

<!-- Group tabs row -->
<div class="group-tabs-bar" id="groupTabsBar">
  <div class="group-tabs-inner" id="groupTabsInner"></div>
  <div class="group-overflow-wrap" id="groupOverflowWrap">
    <button class="group-overflow-btn" id="groupOverflowBtn" onclick="toggleOverflowMenu()">
      <span id="groupOverflowLabel">Kategorie</span>
      <i class="ti ti-chevron-down" style="font-size:12px" aria-hidden="true"></i>
    </button>
    <div class="group-overflow-menu" id="groupOverflowMenu"></div>
  </div>
</div>

<!-- Indicator pills row -->
<div class="indicator-pills-bar" id="indicatorPillsBar"></div>
</header>

<div class="container">
  <div class="err-bar" id="errBar"></div>

  <div class="main-grid">
    <div class="sidebar">
      <div class="sidebar-header">
        Länder
        <span class="side-hint line-only" style="font-size:10px;color:var(--text3);font-weight:400">max. alle wählbar</span>
        <span class="side-hint pyr-only" style="font-size:10px;color:var(--text3);font-weight:400">eines wählbar · grau = keine Daten</span>
      </div>
      <div id="cbList"></div>
      <div id="pyrSide">
        <input id="pyrSearch" class="pyr-search" type="search" placeholder="Land suchen…" autocomplete="off"
          oninput="pyrOnSearch(this.value)" aria-label="Land suchen">
        <div id="pyrList" role="radiogroup" aria-label="Land wählen"></div>
      </div>
      <div class="bulk-btns">
        <button onclick="setAll(true)">Alle</button>
        <button onclick="setAll(false)">Keine</button>
      </div>
    </div>

    <div class="chart-col">
      <div class="chart-card">
        <div class="chart-header">
          <div>
            <div class="chart-title" id="chartTitle">Staatsverschuldung</div>
            <div class="chart-subtitle" id="chartSubtitle">Weltbank-Daten</div>
          </div>
        </div>
        <div class="chart-inner">
          <canvas id="chart" role="img" aria-label="Liniendiagramm Wirtschaftsdaten"></canvas>
          <div class="overlay" id="overlay">
            <div class="spinner"></div>
            <div class="overlay-msg" id="overlayMsg">Daten werden geladen…</div>
          </div>
        </div>

        <div class="pyr-controls" id="pyrControls">
          <div class="pyr-row1">
            <button id="pyrPlay" class="pyr-play" onclick="pyrTogglePlay()" aria-label="Abspielen"><i class="ti ti-player-play-filled" aria-hidden="true"></i></button>
            <span class="pyr-year" id="pyrYear">–</span>
            <span class="pyr-badge" id="pyrBadge" hidden>Prognose</span>
            <span class="pyr-spacer"></span>
            <label class="pyr-outline"><input type="checkbox" id="pyrOutline" onchange="pyrSetOutline(this.checked)"> Umriss <span id="pyrOutlineYear"></span></label>
            <div class="pyr-toggle" role="group" aria-label="Einheit">
              <button id="pyrAbsBtn" class="on" onclick="pyrSetPct(false)">absolut</button>
              <button id="pyrPctBtn" onclick="pyrSetPct(true)">%</button>
            </div>
          </div>
          <div class="pyr-track" id="pyrTrack">
            <span id="pyrMin"></span>
            <input type="range" id="pyrSlider" class="pyr-slider" step="1" oninput="pyrOnSlider(this.value)" aria-label="Jahr">
            <span id="pyrMax"></span>
          </div>
          <div class="pyr-legend">
            <span><i style="background:#378ADD"></i>Männer</span>
            <span><i style="background:#D4537E"></i>Frauen</span>
            <span class="pyr-legend-prog">Balken heller = Prognose</span>
          </div>
        </div>

        <div class="year-range-wrap">
          <div class="year-range-labels">
            <span id="yearFrom">1990</span>
            <span style="color:var(--text3);font-size:11px">Zeitraum</span>
            <span id="yearTo">2024</span>
          </div>
          <div class="year-range-track" id="rangeTrack">
            <div class="year-range-fill" id="rangeFill"></div>
            <input type="range" id="sliderFrom" min="1990" max="2024" value="1990" step="1"
              oninput="onRangeInput()" class="year-slider year-slider-from">
            <input type="range" id="sliderTo"   min="1990" max="2024" value="2024" step="1"
              oninput="onRangeInput()" class="year-slider year-slider-to">
          </div>
        </div>
      </div>

      <div class="stats" id="stats"></div>
      <div class="explainer" id="explainer"></div>
      <div class="sources-box" id="sourcesBox"></div>
    </div>
  </div>
</div>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <script src="data.js"></script>
  <script src="pyramid.js"></script>
  <script src="app.js"></script>
</body>
</html>
