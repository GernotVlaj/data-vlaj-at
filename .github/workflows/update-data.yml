name: Daten aktualisieren

on:
  schedule:
    # Jeden Montag um 06:00 UTC
    - cron: '0 6 * * 1'
  # Manuell auslösbar im GitHub UI (Actions → Run workflow)
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhängigkeiten installieren
        run: pip install requests

      - name: Pipeline ausführen
        run: python pipeline/fetch_data.py

      - name: data.json committen und pushen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          # Nur committen wenn sich etwas geändert hat
          git diff --staged --quiet || git commit -m "data: wöchentliches Update $(date -u '+%Y-%m-%d')"
          git push
